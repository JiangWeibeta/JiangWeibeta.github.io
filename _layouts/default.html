<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ site.title }}{% if page.title %} · {{ page.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="{{ site.author | default: site.title }}">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.title }}{% if page.title %} · {{ page.title }}{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <meta name="twitter:card" content="summary">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318201f'/%3E%3Ctext x='16' y='21.5' font-family='Georgia,serif' font-size='13' fill='%23fbfcfa' text-anchor='middle'%3EWJ%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>

  <body>
    {{ content }}
  </body>
</html>
